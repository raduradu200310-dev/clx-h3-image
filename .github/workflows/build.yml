name: build-clx-h3-image
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['docker/Dockerfile','.github/workflows/build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - name: Free disk space (inline, no third-party action)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push (only from main)
        if: github.ref == 'refs/heads/main'
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/clx-h3:latest
          docker build -t "$IMG" .
          docker push "$IMG"
