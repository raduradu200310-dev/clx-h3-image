name: build-clx-h3-image
on: { workflow_dispatch: {}, push: { paths: ['docker/Dockerfile','.github/workflows/build.yml'] } }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: easimon/maximize-build-space@v10
        with: { root-reserve-mb: 2048, swap-size-mb: 1024, remove-dotnet: 'true', remove-android: 'true', remove-haskell: 'true', remove-codeql: 'true' }
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with: { context: docker, file: docker/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository_owner }}/clx-h3:latest" }
