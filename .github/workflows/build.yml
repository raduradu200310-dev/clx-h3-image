name: build-clx-h3-image
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['Dockerfile','.github/workflows/build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - name: Free disk + move Docker to /mnt (65 GB free there)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push (only from main)
        if: github.ref == 'refs/heads/main'
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/clx-h3:latest
          docker build -t "$IMG" .
          docker push "$IMG"
